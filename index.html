<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PackItOut: Online Grocery &amp; Local Kirana Shopping App</title>
    <meta name="description" content="PackItOut is your local shopping app. Order groceries from verified neighbourhood kirana stores, upload handwritten Parchi, and get 10-minute counter pickup or delivery." />
    <meta name="keywords" content="PackItOut, packitout, packitout app, packitout grocery, online kirana, local grocery pickup, parchi order, grocery delivery" />
    <link rel="canonical" href="https://packitout.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://packitout.in/" />
    <meta property="og:title" content="PackItOut: Online Grocery &amp; Local Kirana Shopping App" />
    <meta property="og:description" content="Order groceries from nearby local shops, pickup-ready in 10 minutes. Order via app or handwritten Parchi." />
    <meta property="og:image" content="https://packitout.in/icon-512.png" />
    <meta property="og:site_name" content="PackItOut" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://packitout.in/" />
    <meta name="twitter:title" content="PackItOut: Online Grocery &amp; Local Kirana Shopping App" />
    <meta name="twitter:description" content="Order groceries from nearby local shops, pickup-ready in 10 minutes." />
    <meta name="twitter:image" content="https://packitout.in/icon-512.png" />

    <!-- Google Search & Brand Knowledge Graph -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://packitout.in/#website",
          "url": "https://packitout.in/",
          "name": "PackItOut",
          "description": "Online Grocery & Local Kirana Shopping Partner",
          "publisher": {
            "@type": "Organization",
            "name": "Agentic Services Pvt. Ltd.",
            "url": "https://packitout.in/"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "PackItOut",
          "applicationCategory": "ShoppingApplication",
          "operatingSystem": "All",
          "url": "https://packitout.in/",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR"
          }
        }
      ]
    }
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) { r.unregister(); }
        });
      }
    </script>

    <!-- PWA: install + branding. theme-color colours the Android status bar
         when the app is installed; apple-touch-icon is the iOS home-screen
         icon (iOS ignores manifest icons). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PackItOut" />
  </head>
  <body style="margin: 0;">
    <div id="root"></div>
